  --bg:#000;--p:#0A0A0B;--p2:#111113;--p3:#18181B;--ln:#1F1F23;--ln2:#2B2B31;
  --am:#FFA028;--am2:#FFC266;--am-s:rgba(255,160,40,.12);
  --tx:#E9E7E2;--tx2:#9C9A95;--tx3:#5F5E5B;
  --up:#19D27C;--up-s:rgba(25,210,124,.13);--dn:#FF4D4D;--dn-s:rgba(255,77,77,.13);--bl:#4DA8FF;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --top:52px;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--mono);font-size:13px;line-height:1.4;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.up{color:var(--up)}.dn{color:var(--dn)}.am{color:var(--am)}.t2{color:var(--tx2)}.t3{color:var(--tx3)}.bl{color:var(--bl)}
.logo{display:block;aspect-ratio:520/159;background:var(--am);-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.fmark{display:block;aspect-ratio:241/219;background:var(--am);-webkit-mask:var(--fmark) center/contain no-repeat;mask:var(--fmark) center/contain no-repeat}

/* boot */
#boot{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;justify-content:center;padding:0 28px;transition:opacity .5s,visibility .5s}
#boot .logo{width:min(56vw,240px);margin-bottom:26px}
#boot pre{margin:0;font-family:var(--mono);font-size:12px;color:var(--am);line-height:1.8;min-height:120px;white-space:pre-wrap}
#boot pre:after{content:"█";animation:blink 1s steps(1) infinite;color:var(--am)}
#boot.hide{opacity:0;visibility:hidden}
@keyframes blink{50%{opacity:0}}

/* header */
.hdr{position:fixed;top:0;left:0;right:0;z-index:30;padding-top:var(--safe-t);background:#000;border-bottom:1px solid var(--ln)}
.bar{height:var(--top);display:flex;align-items:center;gap:10px;padding:0 12px 0 4px}
.burger{width:44px;height:44px;border:0;background:none;display:grid;place-items:center;cursor:pointer}
.burger i{display:block;width:20px;height:2px;background:var(--am);margin:4px 0}
.burger i:nth-child(2){width:13px}
.brand{width:86px;cursor:pointer}
.hdr .sp{flex:1}
.stat{display:flex;gap:10px;align-items:center;font-size:10.5px;color:var(--tx3);letter-spacing:.04em}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--tx3);margin-right:4px;vertical-align:1px}
.dot.on{background:var(--up);box-shadow:0 0 6px var(--up)}.dot.wa{background:var(--am)}.dot.er{background:var(--dn)}
#clock{color:var(--am);font-size:12px;font-weight:700}
.tape{height:26px;overflow:hidden;border-top:1px solid var(--ln);background:var(--p);white-space:nowrap;position:relative}
.tape .tr{display:inline-block;animation:tape 70s linear infinite;padding-left:100%}
.tape:hover .tr{animation-play-state:paused}
.tape span{display:inline-block;padding:0 14px;line-height:26px;font-size:11.5px;border-right:1px solid var(--ln)}
.tape b{color:var(--am);font-weight:700;margin-right:6px}
@keyframes tape{to{transform:translateX(-100%)}}
.fkeys{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--ln);background:#050505}
.fkeys::-webkit-scrollbar{display:none}
.fkeys a{flex:none;padding:8px 11px;font-size:11px;font-weight:700;color:var(--tx2);letter-spacing:.06em;border-right:1px solid var(--ln);cursor:pointer;white-space:nowrap}
.fkeys a i{font-style:normal;color:var(--tx3);margin-right:5px;font-weight:500}
.fkeys a.on{background:var(--am);color:#000}.fkeys a.on i{color:#000;opacity:.6}

/* drawer */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.7);opacity:0;visibility:hidden;transition:.25s}
.drawer{position:fixed;top:0;bottom:0;left:0;z-index:41;width:min(84vw,320px);background:#050505;border-right:1px solid var(--am);transform:translateX(-102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-top:var(--safe-t)}
body.nav .scrim{opacity:1;visibility:visible}body.nav .drawer{transform:none}
.dr-h{padding:22px 18px 16px;border-bottom:1px solid var(--ln)}
.dr-h .logo{width:150px}
.dr-h div{font-size:10px;color:var(--tx3);letter-spacing:.3em;margin-top:10px}
.dr-n{flex:1;overflow:auto;padding:6px 0 20px}
.dr-g{font-size:9.5px;color:var(--am);letter-spacing:.24em;padding:16px 18px 6px;font-weight:700}
.dr-i{display:flex;align-items:center;gap:12px;padding:10px 18px;font-size:13px;color:var(--tx2);cursor:pointer;border-left:3px solid transparent}
.dr-i i{font-style:normal;font-size:10.5px;color:var(--tx3);width:26px}
.dr-i.on{color:#000;background:var(--am);border-left-color:var(--am2)}.dr-i.on i{color:#000}
.dr-i .c{margin-left:auto;font-size:10.5px;color:var(--am)}.dr-i.on .c{color:#000}
.dr-f{padding:12px 18px calc(14px + var(--safe-b));border-top:1px solid var(--ln);font-size:10.5px;color:var(--tx3);display:flex;justify-content:space-between}

/* layout */
main{padding:calc(var(--top) + 26px + 34px + var(--safe-t) + 10px) 8px calc(30px + var(--safe-b));max-width:900px;margin:0 auto}
.pg{animation:pin .25s ease}
@keyframes pin{from{opacity:0}}
.ttl{position:relative;padding:4px 4px 10px;border-bottom:1px solid var(--ln);margin-bottom:8px}
.ttl h1{margin:0;font-size:17px;font-weight:800;letter-spacing:.04em;color:var(--am)}
.ttl span{display:block;font-size:10.5px;color:var(--tx3);margin-top:3px;letter-spacing:.04em}
.ttl .r{position:absolute;right:4px;top:8px;font-size:11px;color:var(--tx2)}
.pn{background:var(--p);border:1px solid var(--ln);margin-bottom:8px}
.ph{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--ln);background:var(--p2)}
.ph b{font-size:11px;letter-spacing:.14em;color:var(--am);font-weight:800}
.ph b:before{content:"";display:inline-block;width:6px;height:6px;background:var(--am);margin-right:8px;vertical-align:1px}
.ph .r{margin-left:auto;font-size:10.5px;color:var(--tx3)}
.ph .r a,.lk{color:var(--bl);cursor:pointer}
.pb{padding:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* monitor tables */
.mt{width:100%;border-collapse:collapse;table-layout:fixed}
.mt td{padding:7px 10px;border-bottom:1px solid var(--ln);white-space:nowrap;font-size:12.5px}
.mt tr:last-child td{border-bottom:0}
.mt td.k{color:var(--am);font-weight:700;width:62px}
.mt td.n{color:var(--tx2);font-size:11px;overflow:hidden;text-overflow:ellipsis}
.mt td.p{text-align:right;font-weight:700;width:96px;overflow:hidden}
.mt td.c{text-align:right;width:72px;padding-left:4px;padding-right:6px}
.mt td.s{width:62px;padding-left:2px}
.mt tr.flash td.p{animation:fl 1s}
@keyframes fl{0%{background:rgba(255,160,40,.25)}}
.chg{display:inline-block;min-width:60px;text-align:right;padding:2px 5px;font-weight:700;font-size:11.5px}
.chg.up{background:var(--up-s)}.chg.dn{background:var(--dn-s)}
.dl{display:block;font-size:9px;color:var(--tx3);font-weight:500;line-height:1.1}
svg.spk{width:54px;height:18px;display:block}
.kv{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--ln)}
.kv div{padding:8px 10px;border-bottom:1px solid var(--ln);border-right:1px solid var(--ln)}
.kv div:nth-child(2n){border-right:0}
.kv span{display:block;font-size:9.5px;color:var(--tx3);letter-spacing:.12em}
.kv b{font-size:15px;font-weight:800}
.big{font-size:26px;font-weight:800;letter-spacing:-.01em}

/* buttons */
.btn{border:1px solid var(--ln2);background:var(--p2);padding:9px 12px;font-weight:700;font-size:12px;letter-spacing:.06em;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--tx)}
.btn:active{background:var(--p3)}
.btn.go{background:var(--am);color:#000;border-color:var(--am)}
.btn.go:after{content:"‹GO›";font-size:10px;opacity:.6;margin-left:4px}
.btn.rd{color:var(--dn);border-color:rgba(255,77,77,.4)}
.btn.bk{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.tg{display:flex;flex-wrap:wrap;gap:4px}
.tg button{border:1px solid var(--ln2);background:#000;padding:6px 9px;font-size:11px;font-weight:700;color:var(--tx2);cursor:pointer;letter-spacing:.05em}
.tg button.on{background:var(--am);border-color:var(--am);color:#000}
.seg{display:flex;border:1px solid var(--ln2)}
.seg button{flex:1;border:0;border-right:1px solid var(--ln2);background:#000;padding:7px 6px;font-size:11px;font-weight:700;color:var(--tx2);cursor:pointer;letter-spacing:.06em}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--p3);color:var(--am)}
.inp{width:100%;background:#000;border:1px solid var(--ln2);padding:9px 10px;outline:none;font-size:12.5px}
.inp:focus{border-color:var(--am)}
.prog{height:2px;background:var(--ln)}.prog i{display:block;height:100%;width:0;background:var(--am);transition:width .2s}
.sumb{display:flex;flex-wrap:wrap;border-top:1px solid var(--ln)}
.sumb div{flex:1;min-width:70px;padding:7px 10px;border-right:1px solid var(--ln)}
.sumb div:last-child{border-right:0}
.sumb span{display:block;font-size:9px;color:var(--tx3);letter-spacing:.14em}
.sumb b{font-size:14px;font-weight:800}

/* signal rows */
.sr{padding:9px 10px;border-bottom:1px solid var(--ln);cursor:pointer}
.sr:active{background:var(--p2)}
.sr .l1{display:flex;align-items:center;gap:8px}
.sr .sy{color:var(--am);font-weight:800;font-size:14px;min-width:64px}
.tag{font-size:10px;font-weight:800;padding:2px 6px;letter-spacing:.08em}
.tag.L{background:var(--up);color:#000}.tag.S{background:var(--dn);color:#000}
.tag.o{border:1px solid var(--ln2);color:var(--tx2);font-weight:700}
.tag.lv{border:1px solid var(--up);color:var(--up)}.tag.dlg{border:1px solid var(--tx3);color:var(--tx3)}
.sc{margin-left:auto;display:flex;align-items:center;gap:6px;font-weight:800}
.sc i{display:block;width:44px;height:4px;background:var(--ln2);position:relative}
.sc i:after{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--w);background:var(--c)}
.sr .l2{display:flex;gap:12px;margin-top:5px;font-size:11.5px;color:var(--tx2);flex-wrap:wrap}
.sr .l2 b{color:var(--tx);font-weight:600}
.sr .l3{font-size:10.5px;color:var(--tx3);margin-top:3px}
.mtf{display:inline-flex;gap:2px;margin-left:4px}
.mtf i{font-style:normal;font-size:9.5px;padding:0 4px;background:var(--p3);color:var(--tx3)}
.mtf i.u{color:var(--up)}.mtf i.d{color:var(--dn)}
.empty{padding:30px 16px;text-align:center;color:var(--tx3);font-size:12px}
.note{padding:10px;font-size:11.5px;color:var(--tx2);border-left:2px solid var(--am);background:var(--am-s);margin-bottom:8px}

/* positions */
.po{padding:10px;border-bottom:1px solid var(--ln)}
.po .l1{display:flex;align-items:center;gap:8px}
.po .pnl{margin-left:auto;text-align:right}
.po .pnl b{display:block;font-size:15px}
.po .pnl span{font-size:11px}
.rng{position:relative;height:4px;background:linear-gradient(90deg,rgba(255,77,77,.5),var(--ln2) 50%,rgba(25,210,124,.5));margin:14px 0 6px}
.rng .e{position:absolute;top:-4px;width:1px;height:12px;background:var(--tx2)}
.rng .m{position:absolute;top:50%;width:10px;height:10px;background:var(--am);transform:translate(-50%,-50%) rotate(45deg);transition:left .5s}
.rngl{display:flex;justify-content:space-between;font-size:10.5px}
.lv4{display:grid;grid-template-columns:repeat(4,1fr);margin-top:8px;border:1px solid var(--ln)}
.lv4 div{padding:5px 6px;border-right:1px solid var(--ln)}.lv4 div:last-child{border-right:0}
.lv4 span{display:block;font-size:9px;color:var(--tx3);letter-spacing:.1em}.lv4 b{font-size:11.5px}
.hrow{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--ln);cursor:pointer;font-size:12px}
.hrow .r{margin-left:auto;text-align:right}
.res{font-size:9.5px;font-weight:800;padding:1px 5px;letter-spacing:.06em}
.res.TP{color:var(--up);border:1px solid var(--up)}.res.STOP{color:var(--dn);border:1px solid var(--dn)}.res.LIQ{background:var(--dn);color:#000}.res.MAN{color:var(--tx2);border:1px solid var(--ln2)}

/* stats */
.kp{display:grid;grid-template-columns:repeat(3,1fr)}
.kp div{padding:8px 10px;border-right:1px solid var(--ln);border-bottom:1px solid var(--ln)}
.kp div:nth-child(3n){border-right:0}
.kp span{display:block;font-size:9px;color:var(--tx3);letter-spacing:.1em;line-height:1.3}
.kp b{display:block;font-size:13.5px;font-weight:800;margin-top:3px}
.tb{width:100%;border-collapse:collapse;font-size:11.5px}
.tb th{font-size:9px;letter-spacing:.12em;color:var(--tx3);text-align:right;padding:6px 10px;border-bottom:1px solid var(--ln);font-weight:700}
.tb td{text-align:right;padding:6px 10px;border-bottom:1px solid var(--ln)}
.tb th:first-child,.tb td:first-child{text-align:left}
.tb td:first-child{color:var(--am)}
canvas.ch{width:100%;height:230px;display:block;background:#000}

/* news */
.nl{height:420px;overflow:hidden;position:relative}
.nl .trk{animation:roll var(--d,120s) linear infinite}
.nl.ps .trk,.nl:hover .trk{animation-play-state:paused}
@keyframes roll{to{transform:translateY(-50%)}}
.nw{display:flex;gap:10px;padding:8px 10px;border-bottom:1px solid var(--ln);cursor:pointer}
.nw:active{background:var(--p2)}
.nw .tm{color:var(--am);font-size:11px;font-weight:700;flex:none;width:40px}
.nw .tx{flex:1;min-width:0}
.nw .so{font-size:9.5px;color:var(--bl);letter-spacing:.08em;text-transform:uppercase}
.nw .ti{font-family:var(--sans);font-size:13.5px;line-height:1.38;color:var(--tx);margin-top:1px}
.nw .ds{font-family:var(--sans);font-size:12px;color:var(--tx2);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.au{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:8px 10px;border-bottom:1px solid var(--ln)}
.au::-webkit-scrollbar{display:none}
.au button{flex:none;border:1px solid var(--ln2);background:#000;padding:6px 9px;font-size:11px;color:var(--tx2);cursor:pointer;text-align:left}
.au button small{display:block;font-size:9.5px;color:var(--tx3)}
.au button.on{border-color:var(--am);color:var(--am)}

/* calendar */
.cd{padding:6px 10px;background:var(--p3);font-size:11px;font-weight:800;color:var(--am);letter-spacing:.1em;display:flex;justify-content:space-between;position:sticky;top:calc(var(--top) + 60px + var(--safe-t));z-index:2}
.ce{display:grid;grid-template-columns:42px 44px 1fr auto;gap:8px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--ln);font-size:12px}
.ce.past{opacity:.4}
.ce .tm{color:var(--am);font-weight:700}
.ce .cc{font-weight:700;font-size:11px}
.imp{display:inline-flex;gap:2px;margin-top:3px}.imp i{width:4px;height:8px;background:var(--ln2)}
.imp.H i{background:var(--dn)}.imp.M i:nth-child(-n+2){background:var(--am)}.imp.L i:first-child{background:var(--tx2)}
.ce .ti{font-family:var(--sans);font-size:12.5px;line-height:1.3}
.ce .or{font-size:10px;color:var(--tx3);margin-top:1px}
.ce .vl{text-align:right;font-size:10.5px;color:var(--tx2);line-height:1.5;white-space:nowrap}
.ce .vl b{color:var(--tx)}
.cb{display:grid;grid-template-columns:1fr 1fr}
.cb div{padding:9px 10px;border-right:1px solid var(--ln)}.cb div:last-child{border-right:0}
.cb span{font-size:9.5px;color:var(--tx3);letter-spacing:.12em;display:block}
.cb b{display:block;font-size:12.5px;margin:2px 0}
.cb em{font-style:normal;color:var(--am);font-weight:800}

/* sheet */
.sbg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.72);opacity:0;visibility:hidden;transition:.25s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:90vh;overflow:auto;background:#060607;border-top:2px solid var(--am);padding:8px 12px calc(20px + var(--safe-b));transform:translateY(calc(100% + 40px));visibility:hidden;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s;max-width:900px;margin:0 auto}
body.sh .sbg{opacity:1;visibility:visible}body.sh .sheet{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:3px;background:var(--ln2);margin:2px auto 12px}
.sh-t{font-size:20px;font-weight:800;color:var(--am);margin:0}
.why{list-style:none;margin:8px 0 0;padding:0;border-top:1px solid var(--ln)}
.why li{padding:6px 0;border-bottom:1px solid var(--ln);font-size:12px;color:var(--tx2)}
.why li:before{content:"› ";color:var(--am)}
.set label{display:block;font-size:10.5px;color:var(--tx2);letter-spacing:.08em;margin:12px 0 5px}
.set .h{font-size:10.5px;color:var(--tx3);margin-top:4px}
#toasts{position:fixed;left:0;right:0;bottom:calc(16px + var(--safe-b));z-index:90;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:#0D0D0F;border:1px solid var(--am);color:var(--tx);padding:9px 14px;font-size:12px;max-width:92vw;animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.foot{text-align:center;color:var(--tx3);font-size:10px;margin:24px 0 6px;letter-spacing:.08em}
.foot .logo{width:70px;margin:0 auto 8px;opacity:.5}
.skel{color:var(--tx3)!important}
@media (min-width:720px){main{padding-left:14px;padding-right:14px}.nl{height:520px}}

@media (max-width:380px){.mt td.n{display:none}}

.selw{position:relative;margin-bottom:8px}
.sel{width:100%;display:flex;align-items:center;gap:10px;background:var(--p2);border:1px solid var(--am);padding:11px 12px;font-weight:800;font-size:15px;color:var(--am);letter-spacing:.06em;cursor:pointer;text-align:left}
.sel small,.selm small{display:block;font-size:10px;color:var(--tx3);font-weight:600;letter-spacing:.04em;margin-top:2px}
.sel i{margin-left:auto;font-style:normal;transition:transform .2s}
.selw.open .sel i{transform:rotate(180deg)}
.selm{display:none;position:absolute;left:0;right:0;top:100%;z-index:20;background:#070708;border:1px solid var(--am);border-top:0;box-shadow:0 14px 30px rgba(0,0,0,.75)}
.selw.open .selm{display:block}
.selm a{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--ln);cursor:pointer;font-weight:800;font-size:13.5px;color:var(--tx)}
.selm a:last-child{border-bottom:0}
.selm a b{margin-left:auto;color:var(--am);font-size:12px}
.selm a.on{background:var(--am-s);color:var(--am)}
.mt tr[data-lsym]{cursor:pointer}.mt tr[data-lsym]:active td{background:var(--p2)}
.mt.lt td.k{width:100px}

/* ===================== CANLI TEMA ===================== */
:root{--bg:#05070C;--p:#0B0F17;--p2:#111723;--p3:#182031;--ln:#1A2232;--ln2:#26304A;
  --am:#FFA62B;--am2:#FFD27A;--am-s:rgba(255,166,43,.14);--up:#20E38C;--up-s:rgba(32,227,140,.16);--dn:#FF4D6A;--dn-s:rgba(255,77,106,.16);--cy:#35E0FF;--bl:#5CB8FF;--tx:#ECEEF3;--tx2:#9AA3B5;--tx3:#5B6478}
html,body{background:var(--bg)}
body:before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(900px 500px at 15% -10%,rgba(255,166,43,.10),transparent 60%),radial-gradient(800px 600px at 110% 30%,rgba(53,224,255,.07),transparent 60%),radial-gradient(700px 500px at 40% 120%,rgba(32,227,140,.06),transparent 60%)}
body:after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.35;background:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px)}
main{position:relative;z-index:1}
.hdr{background:linear-gradient(180deg,rgba(5,7,12,.97),rgba(8,11,18,.94));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,166,43,.25);box-shadow:0 6px 24px rgba(0,0,0,.5)}
.burger i{background:linear-gradient(90deg,var(--am),var(--am2));box-shadow:0 0 8px rgba(255,166,43,.5)}
.logo{background:linear-gradient(100deg,#FFB44A,#FFE3A1 45%,#FFA62B 70%,#FF7A1A)}
.brand{filter:drop-shadow(0 0 6px rgba(255,166,43,.35))}
#clock{background:linear-gradient(90deg,var(--am),var(--am2));-webkit-background-clip:text;background-clip:text;color:transparent;font-size:13px;text-shadow:none}
.dot.on{animation:beat 1.8s ease-in-out infinite}
@keyframes beat{0%,100%{box-shadow:0 0 0 0 rgba(32,227,140,.6)}50%{box-shadow:0 0 0 5px rgba(32,227,140,0)}}
.dot.er{box-shadow:0 0 6px var(--dn)}
.tape{background:linear-gradient(90deg,#0A0E16,#0E1420 50%,#0A0E16);border-top:1px solid var(--ln)}
.tape span{border-right:1px solid rgba(255,255,255,.05)}
.tape b{color:var(--am);text-shadow:0 0 8px rgba(255,166,43,.35)}
.fkeys{background:#070A11}
.fkeys a{transition:color .2s,background .2s;position:relative}
.fkeys a.on{background:linear-gradient(180deg,#FFB547,#FF9A1F);color:#160C00;box-shadow:0 0 18px rgba(255,166,43,.45) inset,0 0 14px rgba(255,166,43,.35)}
.ttl h1{background:linear-gradient(90deg,#FFB547,#FFE3A1 60%,#FFA62B);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:19px;filter:drop-shadow(0 0 10px rgba(255,166,43,.25))}
.ttl{border-bottom:1px solid transparent;border-image:linear-gradient(90deg,rgba(255,166,43,.6),rgba(53,224,255,.25),transparent) 1}
.pn{background:linear-gradient(180deg,rgba(17,23,35,.92),rgba(11,15,23,.92));border:1px solid var(--ln);border-radius:6px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.ph{background:linear-gradient(90deg,rgba(255,166,43,.16),rgba(255,166,43,.03) 55%,transparent);border-bottom:1px solid rgba(255,166,43,.18)}
.ph b:before{background:var(--am);box-shadow:0 0 8px var(--am);border-radius:1px}
.ph .r .up,.ph .r span.up{text-shadow:0 0 8px rgba(32,227,140,.5)}
.mt td{border-bottom:1px solid rgba(255,255,255,.045)}
.mt tr:active td,.mt tr:hover td{background:rgba(255,166,43,.04)}

function nf(v, d) { if (d == null) d = 2; return (v == null || !isFinite(v)) ? '—' : Number(v).toLocaleString('tr-TR', {minimumFractionDigits: d, maximumFractionDigits: d}); }

/* ===== F sevim · GitHub Actions tarayıcısı =====
   GitHub sunucusunda çalışır (tarayıcı kısıtı yok). BIST 100, Nasdaq 100, emtia,
   endeksler, haberler ve ekonomik takvimi çekip data/market.json + data/candles.json üretir. */
(async function () {
  var fs = require('fs');
  var T0 = Date.now();
  var UA = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36', 'Accept': '*/*', 'Accept-Language': 'tr-TR,tr;q=0.9,en;q=0.8'};
  var log = function () { console.log.apply(console, ['[' + ((Date.now() - T0) / 1000).toFixed(1) + 's]'].concat([].slice.call(arguments))); };
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };

  async function get(url, type, tries) {
    tries = tries || 3; var last;
    for (var i = 0; i < tries; i++) {
      try {
        var c = new AbortController(); var to = setTimeout(function () { c.abort(); }, 20000);
        var r = await fetch(url, {headers: UA, signal: c.signal}); clearTimeout(to);
        if (r.status === 429 || r.status >= 500) { last = new Error('HTTP ' + r.status); await sleep(1500 * (i + 1)); continue; }
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return type === 'text' ? await r.text() : await r.json();
      } catch (e) { last = e; await sleep(800 * (i + 1)); }
    }
    throw last;
  }
  async function pool(items, conc, fn) {
    var i = 0, out = new Array(items.length);
    async function w() { while (i < items.length) { var k = i++; try { out[k] = await fn(items[k], k); } catch (e) { out[k] = null; } } }
    var ws = []; for (var n = 0; n < Math.min(conc, items.length); n++) ws.push(w());
    await Promise.all(ws); return out;
  }

  /* ---- Yahoo ---- */
  async function yChart(sym, interval, range) {
    var path = '/v8/finance/chart/' + encodeURIComponent(sym) + '?interval=' + interval + '&range=' + range + '&includePrePost=false';
    var j;
    try { j = await get('https://query1.finance.yahoo.com' + path); } catch (e) { j = await get('https://query2.finance.yahoo.com' + path); }
    var r = j && j.chart && j.chart.result && j.chart.result[0]; if (!r) throw new Error('veri yok');
    var q = (r.indicators.quote || [])[0] || {}, ts = r.timestamp || [], bars = [];
    for (var i = 0; i < ts.length; i++) { if (q.close[i] == null || q.open[i] == null) continue; bars.push({t: ts[i] * 1000, o: q.open[i], h: q.high[i], l: q.low[i], c: q.close[i], v: q.volume ? (q.volume[i] || 0) : 0}); }
    return {bars: bars, meta: r.meta || {}};
  }
  function dropPartial(B, tf) {
    if (!B.length) return B; var L = B[B.length - 1];
    var end = tf === '4h' ? (L.last || L.t) + 36e5 : L.t + TFMS[tf];
    return end > Date.now() ? B.slice(0, -1) : B;
  }
  async function candlesFor(sym, tfs) {
    var out = {}, meta = {};
    var need = function (t) { return tfs.indexOf(t) >= 0; };
    if (need('1h') || need('4h')) {
      var h = await yChart(sym, '60m', '1y'); meta = h.meta;
      if (need('1h')) out['1h'] = dropPartial(h.bars, '1h').slice(-320);
      if (need('4h')) out['4h'] = dropPartial(agg4h(h.bars, h.meta.gmtoffset || 0), '4h').slice(-320);
    }
    if (need('15m')) out['15m'] = dropPartial((await yChart(sym, '15m', '30d')).bars, '15m').slice(-320);
    if (need('30m')) out['30m'] = dropPartial((await yChart(sym, '30m', '60d')).bars, '30m').slice(-320);
    var day = null;
    if (need('1d')) { var d = await yChart(sym, '1d', '2y'); meta = meta.regularMarketPrice ? meta : d.meta; var full = d.bars, done = dropPartial(full, '1d'); out['1d'] = done.slice(-320);
      if (full.length >= 2) { var lastF = full[full.length - 1]; var px = d.meta.regularMarketPrice != null ? d.meta.regularMarketPrice : lastF.c; var prev = done.length === full.length ? full[full.length - 2].c : done[done.length - 1].c; day = {price: px, prev: prev, vol: lastF.v, t: (d.meta.regularMarketTime || 0) * 1000}; } }
    if (need('1w')) out['1w'] = dropPartial((await yChart(sym, '1wk', '10y')).bars, '1w').slice(-320);
    return {tf: out, price: meta.regularMarketPrice, day: day};
  }
  var r6 = function (x) { return x == null ? null : +(+x).toPrecision(6); };
  var CANDLES = {};
  async function scanMarket(key, items, tfs) {
    var res = [], failed = 0, ok = 0, list = [];
    await pool(items, 5, async function (it) {
      var c; try { c = await candlesFor(it.sym, tfs); ok++; } catch (e) { failed++; return; }
      if (c.day) list.push({sym: it.sym, name: it.name, price: r6(c.day.price), chg: c.day.prev ? r6((c.day.price / c.day.prev - 1) * 100) : null, vol: Math.round(c.day.vol || 0), t: c.day.t});
      var trend = {}, sigs = [];
      tfs.forEach(function (tf) {
        var B = c.tf[tf]; if (!B || B.length < 60) return;
        var an = analyze(B, 2); if (!an) return;
        trend[tf] = an.sig ? an.sig.dir : 0;
        if (an.sig) {
          var s = an.sig; s.tl = null;
          s.id = it.sym + '|' + tf + '|' + s.barT + '|' + s.dir; s.mk = key; s.sym = it.sym; s.name = it.name; s.tf = tf; s.price = c.price != null ? c.price : s.entry;
          sigs.push(s);
          CANDLES[key + '|' + it.sym + '|' + tf] = B.slice(-70).map(function (b) { return [Math.round(b.t / 1000), r6(b.o), r6(b.h), r6(b.l), r6(b.c)]; });
        }
      });
      sigs.forEach(function (s) { var b = 0; for (var tf in trend) { if (tf === s.tf || !trend[tf]) continue; b += trend[tf] === s.dir ? 6 : -8; } s.mtfBonus = Math.max(-16, Math.min(12, b)); s.score = Math.max(1, Math.min(99, s.score + s.mtfBonus)); s.mtf = trend; res.push(s); });
    });
    res.sort(function (a, b) { return b.score - a.score; });
    ['entry', 'stop', 'target', 't2', 'level', 'risk', 'atr', 'price'].forEach(function (k) { res.forEach(function (s) { s[k] = r6(s[k]); }); });
    res.forEach(function (s) { s.rsi = r6(s.rsi); s.vx = r6(s.vx); s.riskPct = r6(s.riskPct); });
    log(key, 'tamam:', ok, 'sembol,', failed, 'hata,', res.length, 'sinyal');
    DATA.lists[key] = list;
    return {at: Date.now(), results: res, scanned: items.length, failed: failed, tfs: tfs};
  }

  /* ---- haber ---- */
  function dec(s) { return String(s || '').replace(/<!\[CDATA\[([\s\S]*?)\]\]>/g, '$1').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;|&apos;/g, "'").replace(/&#(\d+);/g, function (_, n) { return String.fromCharCode(+n); }); }
  function parseRSS(xml, cat) {
    var out = [];
    xml.split(/<item[\s>]/).slice(1).forEach(function (raw) {
      var g = function (t) { var m = raw.match(new RegExp('<' + t + '[^>]*>([\\s\\S]*?)</' + t + '>')); return m ? dec(m[1]).trim() : ''; };
      var title = g('title'), src = g('source'), link = g('link');
      var m = title.match(/^(.*)\s[-–]\s([^-–]+)$/); if (m && (!src || m[2].trim() === src)) { title = m[1].trim(); src = src || m[2].trim(); }
      if (!src) { try { src = new URL(link).hostname.replace(/^www\./, ''); } catch (e) { src = ''; } }
      var desc = dec(g('description')).replace(/<[^>]+>/g, ' ').replace(/&nbsp;/g, ' ').replace(/\s+/g, ' ').trim();
      var ts = Date.parse(g('pubDate') || g('dc:date')) || Date.now();
      if (title) out.push({title: title, link: link, src: src, desc: desc && desc !== title && desc.indexOf(title) !== 0 ? desc.slice(0, 400) : '', ts: ts, cat: cat});
    });
    return out;
  }
  async function feeds(cat, urls, max) {
    var lists = await pool(urls, 3, async function (u) { return parseRSS(await get(u, 'text'), cat); });
    var seen = {}, all = [];
    [].concat.apply([], lists.filter(Boolean)).sort(function (a, b) { return b.ts - a.ts; }).forEach(function (x) { var k = x.title.toLowerCase().slice(0, 70); if (!seen[k]) { seen[k] = 1; all.push(x); } });
    return all.slice(0, max || 60);
  }

  /* ---- çalıştır ---- */
  var DATA = {v: ENGINE_V, at: Date.now(), quotes: {}, scans: {}, lists: {}, news: {}, authors: {}, cal: [], errors: []};
  var QUOTES = ['XU100.IS', 'XU030.IS', '^NDX', '^GSPC', 'DX-Y.NYB', '^TNX', '^VIX', 'TRY=X', 'EURTRY=X', 'GC=F', 'SI=F', 'BZ=F', 'CL=F'];
  await pool(QUOTES, 4, async function (s) {
    try { var c = await yChart(s, '15m', '1d'); var m = c.meta; var p = m.regularMarketPrice != null ? m.regularMarketPrice : (c.bars.length ? c.bars[c.bars.length - 1].c : null); var prev = m.chartPreviousClose != null ? m.chartPreviousClose : m.previousClose;
      DATA.quotes[s] = {price: r6(p), prev: r6(prev), chg: prev ? r6((p / prev - 1) * 100) : null, spark: c.bars.map(function (b) { return r6(b.c); }), t: (m.regularMarketTime || 0) * 1000};
    } catch (e) { DATA.errors.push('quote ' + s + ': ' + e.message); }
  });
  log('kotasyonlar:', Object.keys(DATA.quotes).length + '/' + QUOTES.length);

  var bist = BIST100.split(/\s+/).filter(Boolean).map(function (s) { return {sym: s + '.IS', name: s}; });
  var ndx = NDX100.split(/\s+/).filter(Boolean).map(function (s) { return {sym: s, name: s}; });
  var com = COMMOD.map(function (c) { return {sym: c[0], name: c[1]}; });
  DATA.scans.bist = await scanMarket('bist', bist, ['1h', '4h', '1d', '1w']);
  DATA.scans.ndx = await scanMarket('ndx', ndx, ['1h', '4h', '1d', '1w']);
  DATA.scans.com = await scanMarket('com', com, ['15m', '30m', '1h', '4h', '1d', '1w']);

  for (var cat in FEEDS) { try { DATA.news[cat] = await feeds(cat, FEEDS[cat], 60); } catch (e) { DATA.errors.push('news ' + cat); } }
  await pool(AUTHORS, 3, async function (a) { try { DATA.authors[a.n] = await feeds('yorum', [GN(a.q + ' when:30d', a.l)], 25); } catch (e) {} });
  log('haberler:', Object.keys(DATA.news).map(function (k) { return k + ' ' + DATA.news[k].length; }).join(', '));

  try {
    var weeks = await pool(['https://nfs.faireconomy.media/ff_calendar_thisweek.json', 'https://nfs.faireconomy.media/ff_calendar_nextweek.json'], 2, function (u) { return get(u, 'json', 2); });
    weeks.forEach(function (arr) { (arr || []).forEach(function (e) { DATA.cal.push({title: e.title, country: e.country, t: Date.parse(e.date), impact: e.impact, forecast: e.forecast || '', previous: e.previous || '', actual: e.actual || ''}); }); });
    CB_EVENTS.filter(function (e) { return e.bank === 'TCMB'; }).forEach(function (e) { var t = Date.parse(e.t); if (t > Date.now() - 7 * 864e5 && t < Date.now() + 14 * 864e5) DATA.cal.push({title: 'TCMB PPK Faiz Kararı', country: 'TRY', t: t, impact: 'High', forecast: '', previous: ''}); });
    DATA.cal.sort(function (a, b) { return a.t - b.t; });
  } catch (e) { DATA.errors.push('calendar'); }
  log('takvim:', DATA.cal.length);

  DATA.at = Date.now();
  fs.mkdirSync('data', {recursive: true});
  fs.writeFileSync('data/market.json', JSON.stringify(DATA));
  fs.writeFileSync('data/candles.json', JSON.stringify(CANDLES));
  log('yazıldı: market.json', (fs.statSync('data/market.json').size / 1024).toFixed(0) + 'KB, candles.json', (fs.statSync('data/candles.json').size / 1024).toFixed(0) + 'KB', DATA.errors.length ? 'hatalar: ' + DATA.errors.join('; ') : '');
})().catch(function (e) { console.error(e); process.exit(1); });

<script>
'use strict';
/* =====================================================================
   F sevim · Terminal  —  v4.0
   Canlı: Binance (kripto, döviz, metal & enerji)  ·  Bulut: GitHub Actions (BIST, Nasdaq, endeks, haber, takvim)
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const LS = {
  get(k, d) { try { const v = localStorage.getItem('fs4_' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('fs4_' + k, JSON.stringify(v)); } catch (e) {} }
};
// v3'ten simülasyon verisini taşı
(function migrate() { try { if (localStorage.getItem('fs4_acc') == null && localStorage.getItem('fs_acc')) ['pos', 'hist', 'acc', 'cfg'].forEach(k => { const v = localStorage.getItem('fs_' + k); if (v) localStorage.setItem('fs4_' + k, v); }); } catch (e) {} })();

const STABLES = new Set(['USDC','FDUSD','TUSD','BUSD','DAI','USDP','EUR','PYUSD','USDE','RLUSD','XUSD','BFUSD','USD1','AEUR','EURI','USDS','UST','USTC','PAXG','WBTC','WBETH','BNSOL']);
const DEF = {balance0: 1000, margin: 200, maxPos: 5, lev: 7, fee: 0.04, mmr: 0.5, minScore: 60, minVol: 1, rr: 2, tf_crypto: ['1h', '4h'], tf_com: ['15m', '30m', '1h', '4h', '1d', '1w']};
let CFG = Object.assign({}, DEF, LS.get('cfg', {}));
['tf_crypto', 'tf_com'].forEach(k => { if (!Array.isArray(CFG[k])) CFG[k] = DEF[k].slice(); });
const saveCfg = () => LS.set('cfg', CFG);

/* ---------- format ---------- */
const pct = (v, d = 2) => (v == null || !isFinite(v)) ? '—' : (v > 0 ? '+' : '') + nf(v, d) + '%';
const usd = (v, sg) => (v == null || !isFinite(v)) ? '—' : (v < 0 ? '−' : sg && v > 0 ? '+' : '') + '$' + nf(Math.abs(v), 2);
const cls = v => v > 0 ? 'up' : v < 0 ? 'dn' : 't2';
const dtf = o => new Intl.DateTimeFormat('tr-TR', Object.assign({timeZone: TZ}, o));
const fTime = t => dtf({hour: '2-digit', minute: '2-digit'}).format(t);
const fDT = t => dtf({day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'}).format(t);
function ago(t) { const s = (Date.now() - t) / 1000; if (s < 60) return 'şimdi'; if (s < 3600) return Math.floor(s / 60) + 'dk'; if (s < 86400) return Math.floor(s / 3600) + 'sa'; return Math.floor(s / 86400) + 'g'; }
function dur(ms) { const m = Math.max(0, Math.round(ms / 60000)); if (m < 60) return m + 'dk'; const h = Math.floor(m / 60); if (h < 48) return h + 'sa ' + (m % 60) + 'dk'; return Math.floor(h / 24) + 'g ' + (h % 24) + 'sa'; }
function countdown(t) { let s = Math.max(0, Math.floor((t - Date.now()) / 1000)); const d = Math.floor(s / 86400); s %= 86400; const h = Math.floor(s / 3600); s %= 3600; const m = Math.floor(s / 60); const p = n => String(n).padStart(2, '0'); return (d ? d + 'G ' : '') + p(h) + ':' + p(m) + ':' + p(s % 60); }
function toast(m, ms = 2800) { const e = document.createElement('div'); e.className = 'toast'; e.innerHTML = m; $('#toasts').appendChild(e); setTimeout(() => { e.style.transition = '.3s'; e.style.opacity = 0; setTimeout(() => e.remove(), 300); }, ms); }

/* ---------- ağ ---------- */
async function tfetch(url, ms = 12000, opt = {}) { const c = new AbortController(); const t = setTimeout(() => c.abort(), ms); try { const r = await fetch(url, Object.assign({signal: c.signal}, opt)); if (!r.ok) throw new Error('HTTP ' + r.status); return r; } finally { clearTimeout(t); } }
async function pool(items, conc, fn, onProg, isCancel) {
  let i = 0, done = 0; const out = new Array(items.length);
  async function w() { while (i < items.length) { if (isCancel && isCancel()) return; const k = i++; try { out[k] = await fn(items[k], k); } catch (e) { out[k] = null; } done++; onProg && onProg(done, items.length); } }
  await Promise.all(Array.from({length: Math.min(conc, items.length)}, w)); return out;
}
const NETST = {bn: 0, cloud: 0}; // 0 bilinmiyor, 1 ok, -1 hata

/* ---------- Binance ---------- */
const BN = {fut: 'https://fapi.binance.com/fapi/v1', spot: 'https://api.binance.com/api/v3', spot2: 'https://data-api.binance.vision/api/v3'};
let bnMode = LS.get('bnmode', null);
const bnBase = () => bnMode === 'spot' ? BN.spot : BN.fut;
async function bnJSON(path, base) {
  const b = base || bnBase();
  try { const j = await (await tfetch(b + path)).json(); NETST.bn = 1; return j; }
  catch (e) { if (b === BN.spot) { const j = await (await tfetch(BN.spot2 + path)).json(); NETST.bn = 1; return j; } NETST.bn = -1; throw e; }
}
let UNIV = null, UNIV_T = 0, BINFO = null, BINFO_T = 0;
async function bnUniverse(fresh) {
  if (UNIV && Date.now() - UNIV_T < (fresh ? 15e3 : 10 * 60e3)) return UNIV;
  let list = [];
  try {
    if (!BINFO || Date.now() - BINFO_T > 6 * 36e5) { const info = await bnJSON('/exchangeInfo', BN.fut); BINFO = {}; info.symbols.filter(s => s.contractType === 'PERPETUAL' && s.quoteAsset === 'USDT' && s.status === 'TRADING' && (!s.underlyingType || s.underlyingType === 'COIN')).forEach(s => BINFO[s.symbol] = s.baseAsset); BINFO_T = Date.now(); }
    const tick = await bnJSON('/ticker/24hr', BN.fut); const base = BINFO;
    list = tick.filter(t => base[t.symbol] && !STABLES.has(base[t.symbol])).map(t => ({sym: t.symbol, name: base[t.symbol], price: +t.lastPrice, chg: +t.priceChangePercent, vol: +t.quoteVolume}));
    bnMode = 'fut';
  } catch (e) {
    const tick = await bnJSON('/ticker/24hr', BN.spot);
    list = tick.filter(t => /USDT$/.test(t.symbol)).map(t => ({sym: t.symbol, name: t.symbol.replace(/USDT$/, ''), price: +t.lastPrice, chg: +t.priceChangePercent, vol: +t.quoteVolume})).filter(t => !STABLES.has(t.name) && !/(UP|DOWN|BULL|BEAR)$/.test(t.name) && t.price > 0);
    bnMode = 'spot';
  }
  LS.set('bnmode', bnMode);
  const all = list.length; UNIV = list.filter(t => t.vol >= CFG.minVol * 1e6).sort((a, b) => b.vol - a.vol); UNIV.removed = all - UNIV.length; UNIV_T = Date.now();
  return UNIV;
}
const TRADFI_KEYS = {'GC=F': ['XAU', 'GOLD'], 'SI=F': ['XAG', 'SILVER'], 'PL=F': ['XPT', 'PLATINUM'], 'PA=F': ['XPD', 'PALLADIUM'], 'HG=F': ['COPPER', 'XCU', 'HG'], 'CL=F': ['CL', 'WTI', 'USOIL', 'CRUDE'], 'BZ=F': ['BZ', 'BRENT', 'UKOIL'], 'NG=F': ['NATGAS', 'NG', 'NGAS']};
let COMBN = LS.get('combn', {}), COMBN_T = 0;
async function bnTradfi() {
  if (COMBN_T && Date.now() - COMBN_T < 30 * 60e3) return COMBN;
  try {
    const info = await bnJSON('/exchangeInfo', BN.fut);
    const tf = info.symbols.filter(x => x.contractType === 'PERPETUAL' && x.status === 'TRADING' && x.quoteAsset === 'USDT' && x.underlyingType && x.underlyingType !== 'COIN');
    const m = {}; for (const y in TRADFI_KEYS) { const hit = tf.find(x => TRADFI_KEYS[y].includes(x.baseAsset) || TRADFI_KEYS[y].includes(x.symbol.replace(/USDT$/, ''))); if (hit) m[y] = hit.symbol; }
    COMBN = m; COMBN_T = Date.now(); LS.set('combn', m);
  } catch (e) {}
  return COMBN;
}
async function bnKlines(sym, iv, {limit = 320, startTime, base} = {}) {
  let q = `/klines?symbol=${sym}&interval=${iv}&limit=${limit}`; if (startTime) q += `&startTime=${startTime}`;
  return (await bnJSON(q, base)).map(k => ({t: k[0], o: +k[1], h: +k[2], l: +k[3], c: +k[4], v: +k[7] || +k[5], ct: k[6]}));
}
async function bnPrices() { const m = {}; (await bnJSON('/ticker/price')).forEach(x => m[x.symbol] = +x.price); return m; }
const QC = {};
async function bnQuote(sym, base = BN.spot) {
  const c = QC[sym]; if (c && Date.now() - c.at < 15e3) return c;
  const [t, k] = await Promise.all([bnJSON('/ticker/24hr?symbol=' + sym, base), bnJSON(`/klines?symbol=${sym}&interval=15m&limit=96`, base)]);
  return QC[sym] = {price: +t.lastPrice, chg: +t.priceChangePercent, spark: k.map(x => +x[4]), at: Date.now(), live: true};
}

/* ---------- bulut verisi (GitHub Actions) ---------- */
const CLOUD = {m: LS.get('cloud', null), at: 0, loading: null, candles: null, candlesAt: 0};
async function loadCloud(force) {
  if (CLOUD.loading) return CLOUD.loading;
  if (!force && CLOUD.at && Date.now() - CLOUD.at < 60e3) return CLOUD.m;
  CLOUD.loading = (async () => {
    try {
      const j = await (await tfetch('data/market.json?t=' + Date.now(), 25000, {cache: 'no-store'})).json();
      CLOUD.m = j; CLOUD.at = Date.now(); NETST.cloud = 1; LS.set('cloud', j); applyCloud();
    } catch (e) { NETST.cloud = -1; }
    finally { CLOUD.loading = null; paintStat(); }
    return CLOUD.m;
  })();
  return CLOUD.loading;
}
async function cloudCandles(key) {
  if (!CLOUD.candles || CLOUD.candlesAt !== (CLOUD.m && CLOUD.m.at)) {
    try { CLOUD.candles = await (await tfetch('data/candles.json?t=' + (CLOUD.m ? CLOUD.m.at : Date.now()), 30000)).json(); CLOUD.candlesAt = CLOUD.m && CLOUD.m.at; } catch (e) { return null; }
  }
  const a = CLOUD.candles[key]; return a ? a.map(x => ({t: x[0] * 1000, o: x[1], h: x[2], l: x[3], c: x[4]})) : null;
}
const cloudAge = () => CLOUD.m ? Date.now() - CLOUD.m.at : Infinity;

function openPos(sig, price, manual) {
  if (POS.some(p => p.sym === sig.sym)) return {err: 'Bu coinde açık pozisyon var'};
  if (POS.length >= CFG.maxPos) return {err: `Limit dolu (${CFG.maxPos})`};
  if (freeM() < CFG.margin) return {err: 'Yetersiz serbest teminat'};
  const side = sig.dir, entry = price || sig.entry, lev = CFG.lev;
  if (side > 0 ? (entry <= sig.stop || entry >= sig.target) : (entry >= sig.stop || entry <= sig.target)) return {err: 'Fiyat stop/hedefi geçmiş'};
  const liq = liqP(side, entry, lev); if (side > 0 ? sig.stop <= liq : sig.stop >= liq) return {err: 'Stop likidasyonun ötesinde'};
  const notional = CFG.margin * lev, qty = notional / entry, feeOpen = notional * CFG.fee / 100;
  const p = {id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), sym: sig.sym, name: sig.name, side, tf: sig.tf, type: sig.type, score: sig.score, entry, stop: sig.stop, target: sig.target, liq, margin: CFG.margin, lev, qty, feeOpen, openT: Date.now(), lastCheck: Date.now(), mark: entry, sigId: sig.id, manual: !!manual};

}
function closePos(p, exit, reason, t) {

  const gross = p.side * (exit - p.entry) * p.qty, feeClose = exit * p.qty * CFG.fee / 100; ACC.balance += gross - feeClose;
  const pnl = gross - p.feeOpen - feeClose;

  const d = a.map((v, i) => (i ? 'L' : 'M') + (i / (a.length - 1) * w).toFixed(1) + ' ' + (h - 1 - (v - mn) / rg * (h - 2)).toFixed(1)).join('');
  return `<svg class="spk" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="${a[a.length - 1] >= a[0] ? '#19D27C' : '#FF4D4D'}" stroke-width="1.2" vector-effect="non-scaling-stroke"/></svg>`;
}

      `<div class="seg" style="margin-bottom:8px">${[['makro', 'FED & MAKRO'], ['yorum', 'YORUMCU'], ['borsa', 'BORSA'], ['kripto', 'KRİPTO']].map(([a, b]) => `<button class="${nTab === a ? 'on' : ''}" data-ntab="${a}">${b}</button>`).join('')}</div>` +
      panel(nTab === 'yorum' ? 'YORUMCULAR' : 'HABERLER', (nTab === 'yorum' ? `<div class="au">${AUTHORS.map((a, i) => `<button class="${nAu === i ? 'on' : ''}" data-au="${i}">${a.n}<small>${a.o}</small></button>`).join('')}</div>` : '') +
        (items.length ? items.slice(0, 60).map((x, i) => `<div class="nw" data-news="nl:${i}"><div class="tm">${fTime(x.ts)}<div class="t3" style="font-size:9.5px;font-weight:500">${dtf({day: '2-digit', month: '2-digit'}).format(x.ts)}</div></div><div class="tx"><div class="so">${esc(x.src)}</div><div class="ti">${esc(x.title)}</div>${x.desc ? `<div class="ds">${esc(x.desc)}</div>` : ''}</div></div>`).join('') : `<div class="empty">${CLOUD.m ? 'HABER BULUNAMADI' : 'BULUT VERİSİ BEKLENİYOR'}</div>`));
  },
  after() { loadQuotes().catch(() => {}); }
};

/* ---- takvim ---- */
PAGES.cal = {
  html() {
    const items = (CLOUD.m && CLOUD.m.cal) || [];
    const it = items.filter(e => (CALF.imp.includes(e.impact) || (e.impact === 'Holiday' && CALF.imp.includes('Low'))) && CALF.ccy.includes(e.country));
    const nx = items.find(x => x.impact === 'High' && x.t > Date.now() && CALF.ccy.includes(x.country));
    let list = '', day = '', now = Date.now(); const dk = t => dtf({year: 'numeric', month: '2-digit', day: '2-digit'}).format(t);
    it.forEach(e => {
      if (dk(e.t) !== day) { day = dk(e.t); list += `<div class="cd"><span>${dtf({weekday: 'long', day: 'numeric', month: 'long'}).format(e.t).toUpperCase()}</span><span>${day === dk(now) ? 'BUGÜN' : ''}</span></div>`; }
      const tr = trEv(e.title), im = e.impact === 'High' ? 'H' : e.impact === 'Medium' ? 'M' : 'L';
      list += `<div class="ce ${e.t < now - 15 * 60e3 ? 'past' : ''}"><div class="tm">${isNaN(e.t) ? '—' : fTime(e.t)}</div><div class="cc">${esc(e.country)}<br><span class="imp ${im}"><i></i><i></i><i></i></span></div><div><div class="ti">${esc(tr)}</div>${tr !== e.title ? `<div class="or">${esc(e.title)}</div>` : ''}</div><div class="vl">${e.actual ? `AÇK <b>${esc(e.actual)}</b><br>` : ''}${e.forecast ? `BKL <b>${esc(e.forecast)}</b><br>` : ''}${e.previous ? `ÖNC ${esc(e.previous)}` : ''}</div></div>`;
    });
    return ttl('EKONOMİK TAKVİM', 'TÜRKİYE SAATİ · BU HAFTA + GELECEK HAFTA') +
      (nx ? panel('SIRADAKİ YÜKSEK ÖNEMLİ VERİ', `<div class="pb" style="display:flex;align-items:center;gap:10px"><div style="flex:1"><b style="font-family:var(--sans);font-size:14px">${esc(trEv(nx.title))}</b><div class="t2" style="font-size:11px">${esc(nx.country)} · ${fDT(nx.t)}${nx.forecast ? ' · BKL ' + esc(nx.forecast) : ''}</div></div><b class="am" style="font-size:16px" data-cd="${nx.t}">${countdown(nx.t)}</b></div>`) : '') +
      panel('FİLTRE', `<div class="pb"><div class="tg" style="margin-bottom:6px">${[['High', 'YÜKSEK'], ['Medium', 'ORTA'], ['Low', 'DÜŞÜK']].map(([a, b]) => `<button class="${CALF.imp.includes(a) ? 'on' : ''}" data-imp="${a}">${b}</button>`).join('')}</div><div class="tg">${CCY.map(c => `<button class="${CALF.ccy.includes(c) ? 'on' : ''}" data-ccy="${c}">${c}</button>`).join('')}</div></div>`) +
      panel('TAKVİM', list || `<div class="empty">${items.length ? 'FİLTREYE UYGUN VERİ YOK' : 'BULUT VERİSİ BEKLENİYOR'}</div>`);
  }
};

/* ---- ayarlar ---- */
function repoInfo() { const h = location.hostname; if (!h.endsWith('github.io')) return null; return {owner: h.split('.')[0], repo: location.pathname.split('/').filter(Boolean)[0] || ''}; }
PAGES.settings = {
  html() {
    const f = (k, l, h, st = 'any') => `<label>${l}</label><input class="inp" type="number" step="${st}" data-cfg="${k}" value="${CFG[k]}">`;
    const ri = repoInfo(); const act = ri ? `https://github.com/${ri.owner}/${ri.repo}/actions` : null;
    return ttl('AYARLAR', 'SİSTEM') +
      panel('VERİ DURUMU', `<div class="kv" style="border-top:0"><div><span>BINANCE (CANLI)</span><b class="${NETST.bn < 0 ? 'dn' : 'up'}">${NETST.bn < 0 ? 'HATA' : 'BAĞLI'}</b></div><div><span>TARAMA</span><b class="${CLOUD.m ? (cloudAge() > 90 * 60e3 ? 'am' : 'up') : 'dn'}">${CLOUD.m ? fTime(CLOUD.m.at) + ' · ' + ago(CLOUD.m.at) : 'YOK'}</b></div></div>`) +
      panel('SİMÜLASYON', `<div class="pb set">${f('balance0', 'BAŞLANGIÇ BAKİYESİ ($)', 'Sıfırlamadan sonra geçerli olur.')}${f('margin', 'İŞLEM BAŞI TEMİNAT ($)')}${f('maxPos', 'MAKS. POZİSYON', '', 1)}${f('lev', 'KALDIRAÇ (X)', '', 1)}${f('minScore', 'MİN. SKOR', '1–99', 1)}${f('rr', 'RİSK:ÖDÜL (HEDEF = RİSK × DEĞER)')}${f('fee', 'KOMİSYON (% HER YÖN)')}</div>`) +
      panel('KRİPTO FİLTRESİ', `<div class="pb set">${f('minVol', 'MİN. 24S HACİM (MİLYON $)', 'Düşürdükçe daha çok coin taranır.')}</div>`) +
      panel('SIFIRLA', `<div class="pb"><button class="btn rd bk" data-act="reset">SİMÜLASYONU SIFIRLA</button></div>`);
  },
  after() { $$('[data-cfg]').forEach(i => i.onchange = () => { const v = parseFloat(String(i.value).replace(',', '.')); if (!isFinite(v)) return; CFG[i.dataset.cfg] = v; if (i.dataset.cfg === 'minVol') UNIV_T = 0; saveCfg(); toast('KAYDEDİLDİ'); }); }
};

/* ---------- olaylar ---------- */
document.addEventListener('click', e => {
  if (!e.target.closest('#selw')) { const w = $('#selw'); if (w) w.classList.remove('open'); }
  const t = e.target.closest('[data-go],[data-act],[data-lsym],[data-lsrt],[data-tf],[data-flt],[data-srt],[data-sig],[data-news],[data-hist],[data-per],[data-ntab],[data-au],[data-imp],[data-ccy]'); if (!t) return; const d = t.dataset;
  if (d.go) { e.preventDefault(); if (navOpen) { navOpen = false; document.body.classList.remove('nav'); history.replaceState(null, '', '#' + d.go); route = d.go; renderNav(); renderPage(true); } else go(d.go); return; }
  if (d.act) {
    const a = d.act.split(':')[0], arg = d.act.slice(d.act.indexOf(':') + 1);
    if (a === 'scan') runScan(arg);
    else if (a === 'scantrade') runScan('crypto', {trade: true});
    else if (a === 'seltog') $('#selw').classList.toggle('open');
    else if (a === 'selmk') { SCANMK = arg; LS.set('scanmk', arg); renderNav(); renderPage(); }
    else if (a === 'goscan') { SCANMK = arg; LS.set('scanmk', arg); if (shOpen) { shOpen = false; document.body.classList.remove('sh'); history.replaceState(null, '', '#scan'); route = 'scan'; renderNav(); renderPage(true); } else go('scan'); }
    else if (a === 'fill') { if (SC.crypto.running) return; t.disabled = true; autoFill(SC.crypto.results).then(() => { renderNav(); renderPage(); }); }
    else if (a === 'cancel') { SC[arg].cancel = true; toast('DURDURULUYOR…'); }
    else if (a === 'shclose') closeSheet();
    else if (a === 'open') { const s = findSig(arg); if (!s) return; t.disabled = true; bnPrices().catch(() => ({})).then(m => { const r = openPos(s, m[s.sym] || s.entry, true); if (r.err) { toast(r.err); t.disabled = false; } else { toast(`<b class="am">${esc(dispSym('crypto', s.sym))}</b> ${s.dir > 0 ? 'LONG' : 'SHORT'} AÇILDI · ${CFG.lev}X`); closeSheet(); renderNav(); softRender(); } }); }
    else if (a === 'close') { const p = POS.find(x => x.id === arg); if (p) confirmSheet('POZİSYONU KAPAT', `${esc(dispSym('crypto', p.sym))} güncel fiyattan (${fp(p.mark)}) kapatılacak.`, 'KAPAT', () => { closePos(p, p.mark, 'MAN'); renderNav(); renderPage(); }); }
    else if (a === 'reset') confirmSheet('SİMÜLASYONU SIFIRLA', 'Tüm pozisyonlar, geçmiş ve istatistikler silinir; bakiye başlangıç değerine döner.', 'SIFIRLA', () => { resetSim(); toast('SIFIRLANDI'); renderNav(); renderPage(); });
    else if (a === 'csv') exportCSV();
    return;
  }
  if (d.lsym) { const i = d.lsym.indexOf('|'); symSheet(d.lsym.slice(0, i), d.lsym.slice(i + 1)); return; }
  if (d.lsrt) { const [mk, v] = d.lsrt.split(':'); LST[mk].sort = v; $$(`[data-lsrt^="${mk}:"]`).forEach(b => b.classList.toggle('on', b === t)); softRender(); return; }
  if (d.tf) { const [mk, tf] = d.tf.split(':'); const arr = CFG['tf_' + mk]; const i = arr.indexOf(tf); i >= 0 ? arr.splice(i, 1) : arr.push(tf); saveCfg(); t.classList.toggle('on'); return; }
  if (d.flt) { const [mk, v] = d.flt.split(':'); SC[mk].filter = v; $$(`[data-flt^="${mk}:"]`).forEach(b => b.classList.toggle('on', b === t)); softRender(); return; }
  if (d.srt) { const [mk, v] = d.srt.split(':'); SC[mk].sort = v; $$(`[data-srt^="${mk}:"]`).forEach(b => b.classList.toggle('on', b === t)); softRender(); return; }
  if (d.sig) { const s = findSig(d.sig); if (s) sigSheet(s); return; }
  if (d.news) { const x = (window._nl || [])[+d.news.split(':')[1]]; if (x) newsSheet(x); return; }
  if (d.hist) { const h = HIST.find(x => x.id === d.hist); if (h) histSheet(h); return; }
  if (d.per) { statPer = d.per; renderPage(); return; }
  if (d.ntab) { nTab = d.ntab; renderPage(); return; }
  if (d.au) { nAu = +d.au; renderPage(); return; }
  if (d.imp) { const i = CALF.imp.indexOf(d.imp); i >= 0 ? CALF.imp.splice(i, 1) : CALF.imp.push(d.imp); LS.set('calimp', CALF.imp); renderPage(); return; }
  if (d.ccy) { const i = CALF.ccy.indexOf(d.ccy); i >= 0 ? CALF.ccy.splice(i, 1) : CALF.ccy.push(d.ccy); LS.set('calccy', CALF.ccy); renderPage(); return; }
});
document.addEventListener('input', e => { const ds = e.target.dataset || {}; if (ds.q) { SC[ds.q].q = e.target.value; softRender(); } if (ds.lq) { LST[ds.lq].q = e.target.value; softRender(); } });
$('#burger').onclick = () => navOpen ? closeNav() : openNav();
$('#scrim').onclick = () => closeNav();
$('#sbg').onclick = () => closeSheet();
(() => { let y0 = null; const sh = $('#sheet'); sh.addEventListener('touchstart', e => { y0 = sh.scrollTop <= 0 ? e.touches[0].clientY : null; }, {passive: true}); sh.addEventListener('touchmove', e => { if (y0 == null) return; const dy = e.touches[0].clientY - y0; if (dy > 0) sh.style.transform = `translateY(${dy}px)`; }, {passive: true}); sh.addEventListener('touchend', e => { if (y0 == null) return; const dy = e.changedTouches[0].clientY - y0; sh.style.transform = ''; if (dy > 110) closeSheet(); y0 = null; }); })();

/* ---------- zamanlayıcılar ---------- */
setInterval(() => { $('#clock').textContent = fTime(Date.now()); $$('[data-cd]').forEach(el => el.textContent = countdown(+el.dataset.cd)); }, 1000);
setInterval(() => { if (!document.hidden) refreshMarks(); }, 10e3);
setInterval(() => { if (!document.hidden) checkPositions(); }, 45e3);
setInterval(() => { if (document.hidden) return; loadQuotes().catch(() => {}); if (route === 'crypto' || route === 'com') refreshList(route); }, 20e3);
setInterval(() => { if (!document.hidden) loadCloud(); }, 5 * 60e3);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { checkPositions(); refreshMarks(); loadCloud(); loadQuotes().catch(() => {}); } });

/* ---------- açılış ---------- */
(async function init() {
  route = PAGES[location.hash.slice(1)] ? location.hash.slice(1) : 'home'; if (!location.hash) history.replaceState(null, '', '#home');
  mergeCom(); if (CLOUD.m) applyCloud();
  renderNav(); paintStat(); paintTape(); renderPage(true);
  const lines = ['F SEVİM TERMİNAL v4.0', '> BINANCE CANLI AKIŞ ............ BAĞLANIYOR', '> BULUT TARAMASI (GITHUB) ....... YÜKLENİYOR', '> SİNYAL MOTORU ................. HAZIR'];
  const pre = $('#boot pre'); let i = 0; const tick = setInterval(() => { pre.textContent = lines.slice(0, ++i).join('\n'); if (i >= lines.length) clearInterval(tick); }, 220);
  setTimeout(() => $('#boot').classList.add('hide'), 1400);
  loadCloud().then(() => { paintStat(); if (!['crypto', 'trade', 'scan'].includes(route)) renderPage(); loadQuotes().catch(() => {}); });
  loadQuotes().catch(() => {}); setTimeout(() => { checkPositions(); refreshMarks(); }, 800);
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();

</script>
