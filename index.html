  --bg:#0A0D14;--p:#121722;--p2:#171D2B;--p3:#1E2636;--ln:rgba(255,255,255,.06);--ln2:rgba(255,255,255,.11);
  --am:#E9B44C;--am2:#F6D891;--am-s:rgba(233,180,76,.12);--gold:linear-gradient(135deg,#F6D891,#E9B44C 50%,#C98A2A);
  --tx:#EEF1F6;--tx2:#9AA3B4;--tx3:#636C7D;
  --up:#2FD08A;--up-s:rgba(47,208,138,.13);--dn:#F2616E;--dn-s:rgba(242,97,110,.13);--bl:#5BB6FF;
  --sans:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;--mono:var(--sans);
  --top:56px;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden;font-variant-numeric:tabular-nums}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(900px 420px at 50% -160px,rgba(233,180,76,.10),transparent 65%)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.up{color:var(--up)}.dn{color:var(--dn)}.am{color:var(--am)}.t2{color:var(--tx2)}.t3{color:var(--tx3)}.bl{color:var(--bl)}
.logo{display:block;aspect-ratio:520/159;background:var(--gold);-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.fmark{display:block;aspect-ratio:241/219;background:var(--gold);-webkit-mask:var(--fmark) center/contain no-repeat;mask:var(--fmark) center/contain no-repeat}

/* açılış */
#boot{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s,visibility .5s}
#boot .logo{width:min(58vw,250px);animation:bin 1s cubic-bezier(.2,.7,.2,1) both}
#boot pre{display:none}
#boot.hide{opacity:0;visibility:hidden}
@keyframes bin{from{opacity:0;transform:translateY(8px) scale(.98)}}

/* üst bar */
.hdr{position:fixed;top:0;left:0;right:0;z-index:30;padding-top:var(--safe-t);background:rgba(10,13,20,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--ln)}
.bar{height:var(--top);display:flex;align-items:center;gap:8px;padding:0 14px 0 6px}
.burger{width:44px;height:44px;border:0;background:none;display:grid;place-items:center;cursor:pointer;border-radius:12px}
.burger:active{background:rgba(255,255,255,.05)}
.burger i{display:block;width:20px;height:2px;border-radius:2px;background:var(--am);margin:4px 0}
.burger i:nth-child(2){width:14px}
.brand{width:92px;cursor:pointer}
.hdr .sp{flex:1}
.stat{display:flex;gap:10px;align-items:center;font-size:11px;color:var(--tx3);font-weight:600}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--tx3);margin-right:5px;vertical-align:0}
.dot.on{background:var(--up);animation:beat 2s ease-in-out infinite}.dot.wa{background:var(--am)}.dot.er{background:var(--dn)}
@keyframes beat{0%,100%{box-shadow:0 0 0 0 rgba(47,208,138,.5)}50%{box-shadow:0 0 0 5px rgba(47,208,138,0)}}
#clock{font-size:15px;font-weight:700;color:var(--tx);margin-left:4px}
.tape{display:none}
.fkeys{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:6px 10px 8px}
.fkeys::-webkit-scrollbar{display:none}
.fkeys a{flex:none;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--tx2);border-radius:20px;cursor:pointer;white-space:nowrap;transition:.2s}
.fkeys a.on{background:var(--gold);color:#1B1305}

/* menü */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);opacity:0;visibility:hidden;transition:.3s}
.drawer{position:fixed;top:0;bottom:0;left:0;z-index:41;width:min(82vw,310px);background:#0E121B;border-right:1px solid var(--ln2);transform:translateX(-102%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-top:var(--safe-t)}
body.nav .scrim{opacity:1;visibility:visible}body.nav .drawer{transform:none}
.dr-h{padding:26px 22px 18px;border-bottom:1px solid var(--ln)}
.dr-h .logo{width:150px}.dr-h div{display:none}
.dr-n{flex:1;overflow:auto;padding:6px 10px 20px}
.dr-g{font-size:11px;color:var(--tx3);font-weight:700;letter-spacing:.08em;padding:16px 12px 6px}
.dr-i{display:flex;align-items:center;gap:12px;padding:11px 12px;font-size:14.5px;font-weight:500;color:var(--tx2);cursor:pointer;border-radius:12px}
.dr-i.on{color:var(--tx);background:var(--am-s);box-shadow:inset 3px 0 0 var(--am)}
.dr-i .c{margin-left:auto;font-size:11.5px;color:var(--am);font-weight:700}

/* sayfa */
main{position:relative;z-index:1;padding:calc(var(--top) + 46px + var(--safe-t) + 12px) 14px calc(30px + var(--safe-b));max-width:860px;margin:0 auto}
.pg{animation:pin .3s ease}
@keyframes pin{from{opacity:0;transform:translateY(6px)}}
.ttl{position:relative;padding:4px 2px 14px}
.ttl h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em}
.ttl span{display:block;font-size:13px;color:var(--tx2);margin-top:2px}
.ttl .r{position:absolute;right:2px;top:10px;font-size:12.5px;color:var(--tx2);font-weight:600}
.pn{background:var(--p);border:1px solid var(--ln);border-radius:16px;margin-bottom:12px;overflow:hidden}
.ph{display:flex;align-items:center;gap:8px;padding:12px 14px 8px}
.ph b{font-size:12px;letter-spacing:.06em;color:var(--tx2);font-weight:700}
.ph .r{margin-left:auto;font-size:12px;color:var(--tx3);font-weight:600}
.ph .r a,.lk{color:var(--am);cursor:pointer;font-weight:700}
.pb{padding:12px 14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* tablolar */
.mt{width:100%;border-collapse:collapse;table-layout:fixed}
.mt td{padding:11px 14px;border-top:1px solid var(--ln);white-space:nowrap;font-size:14px}
.mt td.k{font-weight:700;width:96px}
.mt td.n{color:var(--tx3);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.mt td.p{text-align:right;font-weight:700;width:104px;overflow:hidden}
.mt td.c{text-align:right;width:84px;padding-left:4px}
.mt td.s{width:64px;padding-left:2px}
.mt.lt td.k{width:112px}
.mt tr[data-lsym]{cursor:pointer}.mt tr[data-lsym]:active td{background:var(--p2)}
.chg{display:inline-block;min-width:64px;text-align:center;padding:3px 7px;font-weight:700;font-size:12.5px;border-radius:8px}
.chg.up{background:var(--up-s)}.chg.dn{background:var(--dn-s)}
.dl{display:block;font-size:10.5px;color:var(--tx3);font-weight:500;line-height:1.2}
svg.spk{width:60px;height:22px;display:block}
tr.fl-up td.p{animation:flu 1.1s ease-out}tr.fl-dn td.p{animation:fld 1.1s ease-out}
@keyframes flu{0%{color:var(--up);background:var(--up-s)}}@keyframes fld{0%{color:var(--dn);background:var(--dn-s)}}
.kv{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--ln)}
.kv div{padding:11px 14px;border-bottom:1px solid var(--ln)}
.kv div:nth-child(odd){border-right:1px solid var(--ln)}
.kv span{display:block;font-size:11.5px;color:var(--tx3);font-weight:600}
.kv b{font-size:16px;font-weight:700}
.big{font-size:30px;font-weight:800;letter-spacing:-.02em}

/* ana sayfa kartları */
.hg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.hc{background:var(--p);border:1px solid var(--ln);border-radius:16px;padding:14px 14px 10px;display:flex;flex-direction:column;min-height:138px;position:relative;overflow:hidden}
.hc .hn{font-size:13px;font-weight:600;color:var(--tx2);display:flex;justify-content:space-between;align-items:center;gap:6px}
.hc .hs{font-size:10.5px;color:var(--tx3);font-weight:600;margin-top:1px}
.hc .hp{font-size:21px;font-weight:800;letter-spacing:-.01em;margin-top:10px;border-radius:6px;transition:color .3s}
.hc .hx{font-size:11.5px;color:var(--tx3);margin-top:1px}
.hc svg.spk{width:100%;height:30px;margin-top:auto}
.hc.fl-up .hp{animation:flu2 1.1s ease-out}.hc.fl-dn .hp{animation:fld2 1.1s ease-out}
@keyframes flu2{0%{color:var(--up)}}@keyframes fld2{0%{color:var(--dn)}}
.hc .lvb{font-size:10px;font-weight:700;color:var(--up)}.hc .lvb.g{color:var(--tx3)}
.cbg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.cbc{background:linear-gradient(160deg,rgba(233,180,76,.14),rgba(233,180,76,.02) 60%),var(--p);border:1px solid rgba(233,180,76,.22);border-radius:16px;padding:14px}
.cbc .k{font-size:11px;font-weight:800;color:var(--am);letter-spacing:.08em}
.cbc .t{font-size:13px;font-weight:600;margin-top:4px}
.cbc .d{font-size:11.5px;color:var(--tx3);margin-top:2px}
.cbc .cd2{font-size:19px;font-weight:800;margin-top:10px;letter-spacing:-.01em}
.cbc .cd2 small{font-size:11px;color:var(--tx3);font-weight:600;margin-left:3px}

/* butonlar */
.btn{border:1px solid var(--ln2);background:var(--p2);padding:11px 14px;font-weight:700;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--tx);border-radius:12px;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.go{background:var(--gold);color:#1B1305;border:0;box-shadow:0 8px 22px -10px rgba(233,180,76,.7)}
.btn.rd{color:var(--dn);border-color:rgba(242,97,110,.35);background:var(--dn-s)}
.btn.bk{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.tg{display:flex;flex-wrap:wrap;gap:6px}
.tg button{border:1px solid var(--ln2);background:transparent;padding:7px 12px;font-size:12.5px;font-weight:700;color:var(--tx2);cursor:pointer;border-radius:20px}
.tg button.on{background:var(--gold);border-color:transparent;color:#1B1305}
.seg{display:flex;background:var(--p);border:1px solid var(--ln);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:8px 6px;font-size:12.5px;font-weight:700;color:var(--tx2);cursor:pointer;border-radius:9px}
.seg button.on{background:var(--p3);color:var(--tx)}
.inp{width:100%;background:var(--p);border:1px solid var(--ln);padding:11px 13px;outline:none;font-size:14px;border-radius:12px}
.inp:focus{border-color:rgba(233,180,76,.5)}
.prog{height:3px;background:var(--ln)}.prog i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}
.sumb{display:flex;border-top:1px solid var(--ln)}
.sumb div{flex:1;padding:10px 12px;border-right:1px solid var(--ln)}
.sumb div:last-child{border-right:0}
.sumb span{display:block;font-size:11px;color:var(--tx3);font-weight:600}
.sumb b{font-size:16px;font-weight:800}

/* sinyal satırı */
.sr{padding:13px 14px;border-top:1px solid var(--ln);cursor:pointer;position:relative}
.sr:active{background:var(--p2)}
.sr:before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--c,transparent)}
.sr .l1{display:flex;align-items:center;gap:8px}
.sr .sy{font-weight:800;font-size:16px;min-width:58px}
.tag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:7px;letter-spacing:.02em}
.tag.L{background:var(--up-s);color:var(--up)}.tag.S{background:var(--dn-s);color:var(--dn)}
.tag.o{background:rgba(255,255,255,.06);color:var(--tx2);font-weight:700}
.tag.lv{background:var(--up-s);color:var(--up)}.tag.dlg{background:rgba(255,255,255,.05);color:var(--tx3)}
.sc{margin-left:auto;display:flex;align-items:center;gap:7px;font-weight:800;font-size:15px}
.sc i{display:block;width:40px;height:5px;border-radius:5px;background:var(--p3);position:relative;overflow:hidden}
.sc i:after{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--w);background:var(--c);border-radius:5px}
.sr .l2{display:flex;gap:14px;margin-top:8px;font-size:12.5px;color:var(--tx3);flex-wrap:wrap}
.sr .l2 b{color:var(--tx);font-weight:700}
.sr .l3{font-size:12px;color:var(--tx3);margin-top:5px}
.sr .tms{display:flex;gap:14px;margin-top:6px;font-size:12px;color:var(--tx3)}
.sr .tms b{color:var(--am);font-weight:700}
.mtf{display:inline-flex;gap:3px;margin-left:4px;vertical-align:1px}
.mtf i{font-style:normal;font-size:10px;padding:1px 5px;border-radius:5px;background:var(--p3);color:var(--tx3)}
.mtf i.u{background:var(--up-s);color:var(--up)}.mtf i.d{background:var(--dn-s);color:var(--dn)}
.empty{padding:30px 16px;text-align:center;color:var(--tx3);font-size:13px}
.note{display:none}

/* pozisyon */
.po{padding:14px;border-top:1px solid var(--ln)}
.po .l1{display:flex;align-items:center;gap:8px}
.po .pnl{margin-left:auto;text-align:right}
.po .pnl b{display:block;font-size:17px}
.po .pnl span{font-size:12px}
.rng{position:relative;height:6px;border-radius:6px;background:linear-gradient(90deg,rgba(242,97,110,.55),var(--p3) 50%,rgba(47,208,138,.55));margin:16px 0 7px}
.rng .e{position:absolute;top:-4px;width:2px;height:14px;background:var(--tx2);border-radius:2px}
.rng .m{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--gold);transform:translate(-50%,-50%);box-shadow:0 0 0 4px rgba(233,180,76,.2);transition:left .5s}
.rngl{display:flex;justify-content:space-between;font-size:12px;font-weight:600}
.lv4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.lv4 div{padding:7px 8px;background:var(--p2);border-radius:10px}
.lv4 span{display:block;font-size:10.5px;color:var(--tx3);font-weight:600}.lv4 b{font-size:12.5px}
.hrow{display:flex;align-items:center;gap:8px;padding:11px 14px;border-top:1px solid var(--ln);cursor:pointer;font-size:13px}
.hrow .r{margin-left:auto;text-align:right}
.res{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:6px}
.res.TP{background:var(--up-s);color:var(--up)}.res.STOP{background:var(--dn-s);color:var(--dn)}.res.LIQ{background:var(--dn);color:#fff}.res.MAN{background:rgba(255,255,255,.06);color:var(--tx2)}

/* istatistik */
.kp{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ln)}
.kp div{padding:10px 12px;border-right:1px solid var(--ln);border-bottom:1px solid var(--ln)}
.kp div:nth-child(3n){border-right:0}
.kp span{display:block;font-size:11px;color:var(--tx3);font-weight:600;line-height:1.3}
.kp b{display:block;font-size:14.5px;font-weight:800;margin-top:3px}
.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th{font-size:11px;color:var(--tx3);text-align:right;padding:8px 14px;border-top:1px solid var(--ln);font-weight:600}
.tb td{text-align:right;padding:9px 14px;border-top:1px solid var(--ln)}
.tb th:first-child,.tb td:first-child{text-align:left}
.tb td:first-child{font-weight:700}
canvas.ch{width:100%;height:240px;display:block;background:var(--bg);border-radius:12px}

/* haber */
.nl{height:440px;overflow:hidden;position:relative;-webkit-mask:linear-gradient(transparent,#000 5%,#000 93%,transparent);mask:linear-gradient(transparent,#000 5%,#000 93%,transparent)}
.nl .trk{animation:roll var(--d,120s) linear infinite}
.nl.ps .trk,.nl:hover .trk{animation-play-state:paused}
@keyframes roll{to{transform:translateY(-50%)}}
.nw{display:flex;gap:12px;padding:12px 14px;border-top:1px solid var(--ln);cursor:pointer}
.nw:active{background:var(--p2)}
.nw .tm{color:var(--am);font-size:12px;font-weight:700;flex:none;width:42px}
.nw .tx{flex:1;min-width:0}
.nw .so{font-size:11px;color:var(--tx3);font-weight:600}
.nw .ti{font-size:14.5px;line-height:1.4;color:var(--tx);font-weight:600;margin-top:2px}
.nw .ds{font-size:12.5px;color:var(--tx2);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.au{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px 14px 12px}
.au::-webkit-scrollbar{display:none}
.au button{flex:none;border:1px solid var(--ln2);background:transparent;padding:8px 11px;font-size:12.5px;font-weight:700;color:var(--tx2);cursor:pointer;text-align:left;border-radius:12px}
.au button small{display:block;font-size:10.5px;color:var(--tx3);font-weight:500}
.au button.on{border-color:var(--am);color:var(--am);background:var(--am-s)}

/* takvim */
.cd{padding:9px 14px;background:var(--p2);font-size:12px;font-weight:700;color:var(--am);display:flex;justify-content:space-between;position:sticky;top:calc(var(--top) + 46px + var(--safe-t));z-index:2;border-top:1px solid var(--ln)}
.ce{display:grid;grid-template-columns:44px 40px 1fr auto;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--ln);font-size:13px}
.ce.past{opacity:.4}
.ce .tm{font-weight:700}
.ce .cc{font-weight:700;font-size:11.5px;color:var(--tx2)}
.imp{display:inline-flex;gap:2px;margin-top:3px}.imp i{width:4px;height:9px;border-radius:2px;background:var(--p3)}
.imp.H i{background:var(--dn)}.imp.M i:nth-child(-n+2){background:var(--am)}.imp.L i:first-child{background:var(--tx2)}
.ce .ti{font-size:13.5px;line-height:1.3;font-weight:600}
.ce .or{font-size:11px;color:var(--tx3);margin-top:1px}
.ce .vl{text-align:right;font-size:11.5px;color:var(--tx3);line-height:1.5;white-space:nowrap}
.ce .vl b{color:var(--tx)}
.cb{display:grid;grid-template-columns:1fr 1fr}
.cb div{padding:12px 14px;border-top:1px solid var(--ln)}.cb div:first-child{border-right:1px solid var(--ln)}
.cb span{font-size:11px;color:var(--tx3);font-weight:600;display:block}
.cb b{display:block;font-size:13px;margin:2px 0}
.cb em{font-style:normal;color:var(--am);font-weight:800}

/* alt pencere */
.sbg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);opacity:0;visibility:hidden;transition:.3s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:90vh;overflow:auto;background:#10141E;border-top:1px solid var(--ln2);border-radius:22px 22px 0 0;padding:8px 16px calc(22px + var(--safe-b));transform:translateY(calc(100% + 40px));visibility:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),visibility 0s .35s;max-width:860px;margin:0 auto}
body.sh .sbg{opacity:1;visibility:visible}body.sh .sheet{transform:none;visibility:visible;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:4px;border-radius:4px;background:var(--ln2);margin:4px auto 14px}
.sh-t{font-size:24px;font-weight:800;margin:0;letter-spacing:-.01em}
.sheet .kp{border:1px solid var(--ln);border-radius:12px;overflow:hidden}
.why{list-style:none;margin:10px 0 0;padding:0}
.why li{padding:8px 0;border-bottom:1px solid var(--ln);font-size:13px;color:var(--tx2);display:flex;gap:8px}
.why li:before{content:"•";color:var(--am);font-weight:800}
.set label{display:block;font-size:12px;color:var(--tx2);font-weight:600;margin:12px 0 6px}
#toasts{position:fixed;left:0;right:0;bottom:calc(18px + var(--safe-b));z-index:90;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:#1A2130;border:1px solid var(--ln2);color:var(--tx);padding:11px 16px;font-size:13px;font-weight:600;border-radius:14px;max-width:92vw;box-shadow:0 12px 30px rgba(0,0,0,.5);animation:tin .3s}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
.foot{text-align:center;margin:26px 0 6px}
.foot .logo{width:76px;margin:0 auto;opacity:.45}
.skel{color:var(--tx3)!important}

/* tarama seçici */
.selw{position:relative;margin-bottom:12px}
.sel{width:100%;display:flex;align-items:center;gap:10px;background:var(--p);border:1px solid rgba(233,180,76,.35);padding:13px 14px;font-weight:800;font-size:17px;color:var(--tx);cursor:pointer;text-align:left;border-radius:14px}
.sel small,.selm small{display:block;font-size:12px;color:var(--tx3);font-weight:500;margin-top:1px}
.sel i{margin-left:auto;font-style:normal;color:var(--am);transition:transform .2s}
.selw.open .sel i{transform:rotate(180deg)}
.selm{display:none;position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;background:#141A26;border:1px solid var(--ln2);border-radius:14px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.6)}
.selw.open .selm{display:block}
.selm a{display:flex;align-items:center;gap:10px;padding:13px 14px;border-top:1px solid var(--ln);cursor:pointer;font-weight:700;font-size:15px}
.selm a:first-child{border-top:0}
.selm a b{margin-left:auto;color:var(--am);font-size:13px}
.selm a.on{background:var(--am-s)}
@media (min-width:720px){.hg{grid-template-columns:repeat(3,1fr)}.nl{height:520px}}


/* ================= BÖLÜMLER (v5) ================= */
body[data-zone="kul"]:before{background:radial-gradient(900px 420px at 50% -160px,rgba(226,109,138,.13),transparent 65%)}
body[data-zone="spo"]:before{background:radial-gradient(900px 420px at 50% -160px,rgba(47,208,138,.10),transparent 65%)}
body[data-zone="muz"]:before{background:radial-gradient(900px 420px at 50% -160px,rgba(255,64,96,.13),transparent 65%)}
main{padding-bottom:calc(96px + var(--safe-b))}
body.plon main{padding-bottom:calc(176px + var(--safe-b))}
body.plon.plbig main{padding-bottom:calc(150px + 56vw + var(--safe-b))}
#toasts{bottom:calc(84px + var(--safe-b))}
body.plon #toasts{bottom:calc(164px + var(--safe-b))}

/* alt bölüm menüsü */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:35;display:flex;justify-content:space-around;padding:6px 6px calc(6px + var(--safe-b));background:rgba(10,13,20,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--ln)}
.bnav a{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px 4px;font-size:10.5px;font-weight:700;color:var(--tx3);cursor:pointer;border-radius:14px;letter-spacing:.02em;position:relative;transition:color .2s}
.bnav a svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
.bnav a.on{color:var(--am)}
.bnav a.on svg{transform:translateY(-1px)}
.bnav a.on:before{content:"";position:absolute;top:-7px;left:30%;right:30%;height:2px;border-radius:2px;background:var(--gold)}
.bnav a:active{background:rgba(255,255,255,.04)}
.dr-sx{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:12px 10px 4px}
.dr-sx a{display:flex;align-items:center;gap:8px;padding:11px 10px;border-radius:12px;border:1px solid var(--ln);font-size:13px;font-weight:700;color:var(--tx2);cursor:pointer}

const SPL = {t: 0, fail: 0, busy: false};
const ymdT = t => dk(t).split('.').reverse().join('');
async function sporLive(force) {
  if (SPL.busy || SPL.fail > 3 || !/^s-(gundem|lig|avrupa)$/.test(route) || !CNT.m || !CNT.m.foot) return;
  if (!force && Date.now() - SPL.t < 25e3) return;
  SPL.t = Date.now(); SPL.busy = true; let changed = false;
  const P = {lig: 'soccer/tur.1', ucl: 'soccer/uefa.champions', uel: 'soccer/uefa.europa', uecl: 'soccer/uefa.europa.conf'};
  await Promise.all(Object.keys(P).map(async lg => {
    const F = CNT.m.foot[lg]; if (!F) return;
    const ms = F.m || []; const near = ms.some(m => m.st === 'in' || (m.st === 'pre' && Math.abs(m.t - Date.now()) < 3 * 36e5) || (m.st === 'post' && Date.now() - m.t < 4 * 36e5));
    if (!near && !force) return;
    try {
      const j = await (await tfetch(`https://site.api.espn.com/apis/site/v2/sports/${P[lg]}/scoreboard?dates=${ymdT(Date.now() - 864e5)}-${ymdT(Date.now() + 864e5)}`, 12000)).json();
      (j.events || []).map(espnEv).forEach(m => { const i = ms.findIndex(x => x.id === m.id); const sig = x => [x.st, x.h.s, x.a.s, x.clk].join('|'); if (i < 0) { ms.push(m); changed = true; } else if (sig(ms[i]) !== sig(m)) { ms[i] = m; changed = true; } });
      F.m = ms; SPL.fail = 0;
    } catch (e) { SPL.fail++; }
  }));
  SPL.busy = false;
  if (changed && /^s-(gundem|lig|avrupa)$/.test(route) && !shOpen) { const y = window.scrollY; renderPage(); window.scrollTo(0, y); }
}

    h += `<div class="sec-h"><b>Türler & ruh hali</b></div><div class="tiles">${GENRES.map(([n, a, b]) => key ? `<div class="tile" style="--bgc:linear-gradient(135deg,${a},${b})" data-mz="gen:${esc(n)}">${esc(n)}</div>` : `<a class="tile" style="--bgc:linear-gradient(135deg,${a},${b})" ${aAttr(ytmHref('/search?q=' + encodeURIComponent(n)))}>${esc(n)}</a>`).join('')}</div>`;
    if (key && MZ.trend && MZ.trend.items.length) h += panel('TREND · TÜRKİYE', MZ.trend.items.map(x => vRow(x)).join(''));
    if (MZL.length) h += panel('LİSTELERİM', MZL.slice(0, 4).map(x => vRow(x, true)).join(''), '<a data-go="m-liste">Tümü ›</a>');
    h += panel('MÜZİK GÜNDEMİ', cnRows(mergeNews(['muzik'], 6), 6), '<a data-go="m-haber">Tümü ›</a>');
    return h;
  },
  after() { const i = $('#mzq'); if (i) i.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); i.blur(); mzSearch(i.value); } }); loadTrend(); }
};
PAGES['m-liste'] = {
  html() {
    return ttl('Listelerim', MZL.length ? MZL.length + ' kayıt' : 'YouTube · YT Music') +
      panel('EKLE', `<div class="pb"><input class="inp" id="mzu" placeholder="YouTube / YT Music bağlantısı" inputmode="url"><input class="inp" id="mzn" placeholder="Ad (isteğe bağlı)" style="margin-top:8px"><button class="btn go bk" style="margin-top:8px" data-mz="add">LİSTEYE EKLE</button></div>`) +
      panel('KAYITLI', MZL.length ? MZL.map(x => vRow(x, true)).join('') : emptyB('Henüz kayıt yok')) +
      panel('YOUTUBE ARAMA ANAHTARI', `<div class="pb"><input class="inp" type="password" id="ytk" placeholder="İsteğe bağlı · YouTube Data API" value="${esc(YTK())}" autocomplete="off"><div class="g2" style="margin-top:8px"><button class="btn" data-mz="key">KAYDET</button><a class="btn" ${aAttr('https://console.cloud.google.com/apis/library/youtube.googleapis.com')}>ANAHTAR AL ↗</a></div></div>`);
  }
};
PAGES['m-haber'] = {
  html() { return ttl('Müzik Haberleri', 'Yeni şarkılar, albümler, sahne') + `<div class="qk"><a data-go="k-konser" style="cursor:pointer">Konserler</a>${ext(ytmHref('/explore'), 'Yeni çıkanlar')}</div>` + panel('MÜZİK HABERLERİ', cnRows(mergeNews(['muzik'], 60), 60)) + panel('KONSER GÜNDEMİ', cnRows(mergeNews(['konser'], 10), 10), '<a data-go="k-konser">Tümü ›</a>'); }
};
async function mzAdd() {
  const u = ($('#mzu') || {}).value, n = (($('#mzn') || {}).value || '').trim(); const p = parseYT(u);
  if (!p) { toast('Geçerli bir YouTube bağlantısı değil'); return; }
  const it = {id: Date.now().toString(36), v: p.v, list: p.list, url: p.url, title: n || '', ch: '', img: '', at: Date.now()};
  if (!it.title) { try { const j = await (await tfetch('https://noembed.com/embed?url=' + encodeURIComponent(p.v ? 'https://www.youtube.com/watch?v=' + p.v : p.url), 8000)).json(); if (j.title) { it.title = j.title; it.ch = j.author_name || ''; it.img = j.thumbnail_url || ''; } } catch (e) {} }
  if (!it.title) it.title = p.list && !p.v ? 'Çalma listesi' : p.v ? 'Video' : 'YouTube Music';
  MZL.unshift(it); LS.set('mzl', MZL); toast('Eklendi'); renderPage();
}

/* ---------- tıklamalar (yeni bölümler) ---------- */
function xAct(type, o) {
  if (type === 'otd') otdSheet(o);
  else if (type === 'film') filmSheet(o);
  else if (type === 'book') bookSheet(o);
  else if (type === 'team') teamSheet(o);
  else if (type === 'play') play(o);
  else if (type === 'save') { if (!MZL.some(x => x.v === o.v)) { MZL.unshift(Object.assign({id: Date.now().toString(36), at: Date.now()}, o)); LS.set('mzl', MZL); } toast('Listelerime eklendi'); }
}
function mzAct(a) {
  const i = a.indexOf(':'), k = i < 0 ? a : a.slice(0, i), v = i < 0 ? '' : a.slice(i + 1);
  if (k === 'ara') { const q = ($('#mzq') || {}).value; mzSearch(q); }
  else if (k === 'gen') { MZ.q = v; mzSearch(v); }
  else if (k === 'yplay') { if (shOpen) closeSheet(); ytSearch(v).then(r => { if (r && r[0]) play(r[0]); else toast('Bulunamadı'); }).catch(() => toast('YouTube araması başarısız')); }
  else if (k === 'add') mzAdd();
  else if (k === 'del') { MZL = MZL.filter(x => x.id !== v); LS.set('mzl', MZL); renderPage(); }
  else if (k === 'key') { const val = (($('#ytk') || {}).value || '').trim(); LS.set('ytkey', val); MZ.trend = null; toast(val ? 'Anahtar kaydedildi' : 'Anahtar silindi'); renderPage(); }
  else if (k === 'fav' || k === 'unfav') { const [id, n] = v.split('|'); FAV = k === 'fav' ? {id, n} : null; LS.set('fav', FAV); closeSheet(); toast(FAV ? '★ ' + esc(n) : 'Kaldırıldı'); renderPage(); }
  else if (k === 'pickfav') { const r = (((foot('lig').tb || [])[0] || {}).rows || []).find(x => (x.f + ' ' + x.n).toLocaleLowerCase('tr').includes(v.toLocaleLowerCase('tr').slice(0, 6))); if (r) { FAV = {id: r.id, n: r.n}; LS.set('fav', FAV); toast('★ ' + esc(r.n)); renderPage(); } else toast('Puan tablosu bekleniyor'); }
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-sec],[data-cn],[data-x],[data-kx],[data-mz],[data-pl]'); if (!t) return; const d = t.dataset;
  if (d.sec) { e.preventDefault(); goSec(d.sec); return; }
  if (d.cn) { const [l, i] = d.cn.split(':'); const x = (NLS[+l] || [])[+i]; if (x) newsSheet(x); return; }
  if (d.x) { const r = XR[+d.x]; if (r) xAct(r[0], r[1]); return; }
  if (d.kx) { const i = d.kx.indexOf(':'); KX[d.kx.slice(0, i)] = d.kx.slice(i + 1); LS.set('kx', KX); if (!d.go) renderPage(); return; }
  if (d.mz) { mzAct(d.mz); return; }
  if (d.pl) { if (d.pl === 'big') setBig(!PL.big); else stopPlay(); }
});
setInterval(() => { if (document.hidden) return; const was = CNT.m && CNT.m.at; loadContent().then(() => { if (secOf(route) !== 'fin' && CNT.m && CNT.m.at !== was && !shOpen && !document.activeElement.matches('input')) { const y = window.scrollY; renderPage(); window.scrollTo(0, y); } }); }, 60e3);
setInterval(() => { if (!document.hidden) sporLive(); }, 30e3);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { loadContent(); sporLive(true); } });


/* ---------- zamanlayıcılar ---------- */
setInterval(() => { $('#clock').textContent = fTime(Date.now()); $$('[data-cd]').forEach(el => el.textContent = countdown(+el.dataset.cd)); }, 1000);
setInterval(() => { if (!document.hidden) refreshMarks(); }, 10e3);
setInterval(() => { if (!document.hidden) checkPositions(); }, 45e3);
setInterval(() => { if (document.hidden) return; loadQuotes().catch(() => {}); if (route === 'crypto' || route === 'com') refreshList(route); }, 60e3);
setInterval(() => { if (!document.hidden) loadCloud(); }, 2 * 60e3);
document.addEventListener('visibilitychange', () => { if (document.hidden) { wsClose(); return; } if (!document.hidden) { wsSync(); checkPositions(); refreshMarks(); loadCloud(); loadQuotes().catch(() => {}); } });

/* ---------- açılış ---------- */
(async function init() {
  route = PAGES[location.hash.slice(1)] ? location.hash.slice(1) : 'home'; if (!location.hash) history.replaceState(null, '', '#home');
  mergeCom(); if (CLOUD.m) applyCloud();
  renderNav(); paintStat(); paintTape(); renderPage(true);
  loadContent().then(() => { if (secOf(route) !== 'fin' && !shOpen) renderPage(); });
  const lines = ['F SEVİM TERMİNAL v4.0', '> BINANCE CANLI AKIŞ ............ BAĞLANIYOR', '> BULUT TARAMASI (GITHUB) ....... YÜKLENİYOR', '> SİNYAL MOTORU ................. HAZIR'];
  const pre = $('#boot pre'); let i = 0; const tick = setInterval(() => { pre.textContent = lines.slice(0, ++i).join('\n'); if (i >= lines.length) clearInterval(tick); }, 220);
  setTimeout(() => $('#boot').classList.add('hide'), 1400);
  loadCloud().then(() => { paintStat(); if (!['crypto', 'trade', 'scan'].includes(route)) renderPage(); loadQuotes().catch(() => {}); });
  loadQuotes().catch(() => {}); setTimeout(() => { checkPositions(); refreshMarks(); }, 800);
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();

</script>
